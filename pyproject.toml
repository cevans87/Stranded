[project]
authors = [
    {name = 'Cameron Evans', email = 'c.d.evans87@gmail.com'},
]
classifiers = [
  'Development Status :: 3 - Alpha',
  'Intended Audience :: Developers',
  'Topic :: Software Development :: Libraries',
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Topic :: System :: Logging',
  'License :: OSI Approved :: MIT License',
  'Programming Language :: Python :: 3.12',
]
dependencies = []
keywords = [
    'asyncio',
    'back pressure',
    'cache',
    'memoize',
    'rate limit',
    'retry',
    'throttle',
]
license = {file = 'LICENSE'}
name = 'stranded'
readme = 'README.md'
requires-python = '>=3.12'
version = '0.0.1'

[project.optional-dependencies]
test = ['mypy', 'pytest', 'pytest-asyncio', 'pytest-cov', 'pytest-mypy']

[project.urls]
Homepage = 'https://github.com/cevans87/Stranded'
Issues = 'https://github.com/cevans87/Stranded/issues'
Repository = 'https://github.com/cevans87/Stranded.git'

[tool.setuptools.packages.find]
include = ['*']
where = ['src']

[tool.setuptools.package-data]
stranded = ['py.typed']

[tool.pytest.ini_options]
addopts = [
    '--cov=stranded',
    '--cov-branch',
    '--cov-report=term-missing',
    '--mypy',
]
pythonpath = ['src']
testpaths = ['test', 'src']

[tool.coverage.run]
branch = true
source = ['stranded']

[tool.coverage.report]
exclude_also = [
    'if typing\\.TYPE_CHECKING:',
    '\\.\\.\\.\\s*$',
    'raise NotImplementedError',
    '@(abc\\.)?abstractmethod',
]
show_missing = true
skip_covered = false

[tool.mypy]
strict = true
files = ['src', 'test']
mypy_path = '$MYPY_CONFIG_FILE_DIR/src'
explicit_package_bases = true
namespace_packages = true
