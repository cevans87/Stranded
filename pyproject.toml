[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools>=77']

[project]
authors = [
    {name = 'Cameron Evans', email = 'c.d.evans87@gmail.com'},
]
classifiers = [
  'Development Status :: 3 - Alpha',
  'Intended Audience :: Developers',
  'Topic :: Software Development :: Libraries',
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Topic :: System :: Logging',
  'Framework :: AsyncIO',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Typing :: Typed',
]
dependencies = []
description = 'Composable decorators for caching, retrying, throttling, logging, and CLIs, for both sync and asyncio code'
keywords = [
    'asyncio',
    'back pressure',
    'cache',
    'memoize',
    'rate limit',
    'retry',
    'throttle',
]
license = 'MIT'
license-files = ['LICENSE']
name = 'stranded'
readme = 'README.md'
requires-python = '>=3.13'
version = '0.0.1'

[project.optional-dependencies]
test = ['mypy', 'pytest', 'pytest-asyncio', 'pytest-cov', 'pytest-mypy']

[project.urls]
Homepage = 'https://github.com/cevans87/Stranded'
Issues = 'https://github.com/cevans87/Stranded/issues'
Repository = 'https://github.com/cevans87/Stranded.git'

[tool.setuptools.packages.find]
include = ['*']
where = ['src']

[tool.setuptools.package-data]
stranded = ['py.typed']

[tool.pytest.ini_options]
addopts = [
    '--cov=stranded',
    '--cov-branch',
    '--cov-report=term-missing',
    '--mypy',
]
pythonpath = ['src']
testpaths = ['test', 'src']

[tool.coverage.run]
branch = true
source = ['stranded']

[tool.coverage.report]
exclude_also = [
    'if typing\\.TYPE_CHECKING:',
    '\\.\\.\\.\\s*$',
    'raise NotImplementedError',
    '@(abc\\.)?abstractmethod',
]
show_missing = true
skip_covered = false

[tool.mypy]
strict = true
files = ['src', 'test']
mypy_path = '$MYPY_CONFIG_FILE_DIR/src'
explicit_package_bases = true
namespace_packages = true
